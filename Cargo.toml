[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["RéseauRacine contributors"]
homepage = "https://github.com/giak/reseau-racine"
repository = "https://github.com/giak/reseau-racine"

[workspace.dependencies]
nostr = { version = "0.44", features = ["nip44", "nip59", "nip06"] }
nostr-sdk = { version = "0.44", features = ["nip44", "nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
proptest = "1"
bip39 = { version = "2", features = ["rand"] }
