[advisories]
version = 2
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "MIT-0",
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "BSL-1.0",
    "Unicode-3.0",
    "Unlicense", "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only", "AGPL-3.0-or-later",
    "GPL-3.0-only", "GPL-3.0-or-later", "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "openssl", use-instead = "rustls" },
    { crate = "libssh2-sys", reason = "dépendance système superflue" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
